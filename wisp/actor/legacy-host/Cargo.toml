[package]
name = "wisp-interpreter-actor"
version = "0.1.0"
edition = "2024"

# Keep the current actor independent of the legacy integration workspace.
[workspace]

# The installed command is `theater-repl`; the crate keeps its internal name so
# the library target and existing imports are undisturbed.
[[bin]]
name = "theater-repl"
path = "src/main.rs"

# The host loads a prebuilt actor.wasm and runs it under a local Theater runtime.
# It also embeds the shared Rust interpreter (`wisp`) so a session can evaluate
# forms host-side and reach the live runtime through a `TheaterHost` — the
# convergence onto one interpreter (see src/theater_host.rs).
[dependencies]
granite = { path = "../../.." }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
theater = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
theater-native = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
theater-handler-rpc = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
theater-handler-self = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
theater-handler-store = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
theater-handler-runtime = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
theater-handler-message-server = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
theater-handler-timer = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
theater-handler-assembler = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
theater-handler-filesystem = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
theater-handler-terminal = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
theater-handler-http-client = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
theater-handler-tcp = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
theater-handler-udp = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
theater-handler-process = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
theater-handler-podman = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
theater-handler-lifecycle = { git = "https://github.com/colinrozzi/theater.git", rev = "cbb48982a66ab6adbf71b3ad9c6067a90c5dfb98" }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = 0

# tests/support builds a tiny RPC relay guest by hand (Pack metadata + WAT).
[dev-dependencies]
pack = { package = "packr", version = "=0.24.1" }
wat = "1.242.0"
