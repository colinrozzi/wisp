[package]
name = "wisp-interpreter-actor"
version = "0.1.0"
edition = "2024"

# Keep the current actor independent of the legacy integration workspace.
[workspace]

# The installed command is `theater-repl`; the crate keeps its internal name so
# the library target and existing imports are undisturbed.
[[bin]]
name = "theater-repl"
path = "src/main.rs"

# The host embeds the actor.wasm build.rs generates and runs it under a local Theater runtime.
# It also embeds the shared Rust interpreter (`wisp`) so a session can evaluate
# forms host-side and reach the live runtime through a `TheaterHost` — the
# convergence onto one interpreter (see src/theater_host.rs).
[dependencies]
granite = { path = "../../.." }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
theater = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
theater-native = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
theater-handler-rpc = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
theater-handler-self = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
theater-handler-store = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
theater-handler-runtime = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
theater-handler-message-server = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
theater-handler-timer = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
theater-handler-assembler = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
theater-handler-filesystem = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
theater-handler-terminal = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
theater-handler-http-client = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
theater-handler-tcp = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
theater-handler-udp = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
theater-handler-process = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
theater-handler-podman = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
theater-handler-lifecycle = { git = "https://github.com/colinrozzi/theater.git", rev = "f1200d661e0671da41fc644ec15e408edc26f5df" }
tokio = { version = "1", features = ["full"] }
ed25519-dalek = "2"
getrandom = "0.2"
sha2 = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = 0

# build.rs compiles the Wisp actor with Granite in-process (no nested cargo).
[build-dependencies]
granite = { path = "../../.." }

# tests/support builds a tiny RPC relay guest by hand (Pack metadata + WAT).
[dev-dependencies]
pack = { package = "packr", version = "=0.24.1" }
wat = "1.242.0"
