[package]
name = "wisp-interpreter-actor"
version = "0.1.0"
edition = "2024"

# Keep the current actor independent of the legacy integration workspace.
[workspace]

# The installed command is `theater-repl`; the crate keeps its internal name so
# the library target and existing imports are undisturbed.
[[bin]]
name = "theater-repl"
path = "src/main.rs"

# The host embeds the actor.wasm build.rs generates and runs it under a local Theater runtime.
# It also embeds the shared Rust interpreter (`wisp`) so a session can evaluate
# forms host-side and reach the live runtime through a `TheaterHost` — the
# convergence onto one interpreter (see src/theater_host.rs).
[dependencies]
granite = { path = "../../.." }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
theater = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
theater-native = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
theater-handler-rpc = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
theater-handler-self = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
theater-handler-store = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
theater-handler-runtime = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
theater-handler-message-server = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
theater-handler-timer = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
theater-handler-assembler = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
theater-handler-filesystem = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
theater-handler-terminal = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
theater-handler-http-client = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
theater-handler-tcp = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
theater-handler-udp = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
theater-handler-process = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
theater-handler-podman = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
theater-handler-lifecycle = { git = "https://github.com/colinrozzi/theater.git", rev = "bfda65f1112f0a7ce0fc54421df9c5643a3b7227" }
tokio = { version = "1", features = ["full"] }
ed25519-dalek = "2"
getrandom = "0.2"
sha2 = "0.10"
# HMAC-SHA1 for TOTP (RFC 6238), HMAC-SHA256.
hmac = "0.12"
sha1 = "0.10"
# Web Push (P-256, AES-128-GCM), sealed boxes (X25519, ChaCha20-Poly1305), scrypt.
aes-gcm = "0.10"
base64 = "0.21"
chacha20poly1305 = "0.10"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pem", "pkcs8"] }
scrypt = { version = "0.11", default-features = false }
x25519-dalek = { version = "2", features = ["static_secrets"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = 0

# scrypt at N = 2^15 takes seconds unoptimized; tests and debug daemons check passwords.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3

# build.rs compiles the Wisp actor with Granite in-process (no nested cargo).
[build-dependencies]
granite = { path = "../../.." }

# tests/support builds a tiny RPC relay guest by hand (Pack metadata + WAT).
[dev-dependencies]
pack = { package = "packr", version = "=0.24.2" }
wat = "1.242.0"
