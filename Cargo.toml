[workspace]
members = ["wisp-repl"]
default-members = ["."]
exclude = ["crates", "wisp-actor", "actors/wisp-repl"]
resolver = "3"
# Legacy Theater integrations use crates/; the current actor uses actors/wisp-repl/.

[workspace.dependencies]
# Keep compiler metadata and both Rust runners on the same CGRF v3 implementation.
pack = { package = "packr", version = "=0.24.1" }

[package]
name = "wisp"
version = "0.1.0"
edition = "2024"

[lib]
name = "wisp"
path = "src/lib.rs"

[[bin]]
name = "wisp"
path = "src/main.rs"

[dependencies]
wat = "1.242.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
wasmtime = "21.0.2"
wit-component = "0.220.1"
wit-parser = "0.220.1"
pack.workspace = true

[dev-dependencies]
# Exercise the capture-based engine interface used by current Theater.
packr-core = "=0.24.1"
packr-wasmtime = "=0.24.1"
tokio = { version = "1", features = ["rt"] }
