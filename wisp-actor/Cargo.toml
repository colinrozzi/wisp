[package]
name = "wisp-actor"
version = "0.1.0"
edition = "2021"

# Standalone workspace to avoid being picked up by parent
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Composite guest library for Theater integration
composite-guest = { git = "https://github.com/colinrozzi/composite.git" }

# Memory allocator for no_std
dlmalloc = { version = "0.2", features = ["global"] }

[profile.release]
opt-level = "s"
lto = true
