[package]
name = "theater-handler-wisp"
version = "0.1.0"
edition = "2021"
description = "Theater handler for Wisp-specific host functions (assembler, helpers)"

[dependencies]
# Theater core
theater = { git = "https://github.com/colinrozzi/theater.git" }

# Pack for package composition
pack = { git = "https://github.com/colinrozzi/pack.git" }

# WAT to WASM assembly
wat = "1.222"

# WASM runtime for eval-wasm
wasmtime = "29"

# Async runtime
tokio = { version = "1", features = ["sync"] }

# Logging
tracing = "0.1"

# Error handling
anyhow = "1"
