[package]
name = "assembler-handler"
version = "0.1.0"
edition = "2021"

[dependencies]
# WAT to WASM conversion
wat = "1.242.0"

# Core theater dependencies
theater = { path = "../../../theater/crates/theater" }
val-serde = { path = "../../../theater/crates/val-serde" }

# WebAssembly runtime
wasmtime = { version = "31.0", features = ["component-model", "async"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
