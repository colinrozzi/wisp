[package]
name = "test-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
theater = { git = "https://github.com/colinrozzi/theater.git", tag = "v0.3.0" }
pack = { git = "https://github.com/colinrozzi/pack.git", tag = "v0.2.0" }
wat = "1.242.0"
wasmtime = { version = "31.0", features = ["async"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
serde_json = "1.0"
