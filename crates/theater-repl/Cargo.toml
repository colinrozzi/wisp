[package]
name = "theater-repl"
version = "0.1.0"
edition = "2021"

[dependencies]
# Theater runtime
theater = { path = "/home/colin/work/theater/crates/theater" }
theater-handler-runtime = { path = "/home/colin/work/theater/crates/theater-handler-runtime" }
theater-handler-supervisor = { path = "/home/colin/work/theater/crates/theater-handler-supervisor" }
theater-handler-message-server = { path = "/home/colin/work/theater/crates/theater-handler-message-server" }
theater-handler-store = { path = "/home/colin/work/theater/crates/theater-handler-store" }

# Wisp-specific handler
theater-handler-wisp = { path = "../theater-handler-wisp" }

# Pack for static composition (merging WASM modules)
pack = { path = "../../../pack" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
