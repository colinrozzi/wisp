[package]
name = "theater-repl"
version = "0.1.0"
edition = "2021"

[dependencies]
# Theater runtime
theater = { git = "https://github.com/colinrozzi/theater.git", tag = "v0.3.0" }
theater-handler-runtime = { git = "https://github.com/colinrozzi/theater.git", tag = "v0.3.0" }
theater-handler-supervisor = { git = "https://github.com/colinrozzi/theater.git", tag = "v0.3.0" }
theater-handler-message-server = { git = "https://github.com/colinrozzi/theater.git", tag = "v0.3.0" }
theater-handler-store = { git = "https://github.com/colinrozzi/theater.git", tag = "v0.3.0" }

# Wisp-specific handler
theater-handler-wisp = { path = "../theater-handler-wisp" }

# Pack for static composition (merging WASM modules)
pack = { git = "https://github.com/colinrozzi/pack.git", tag = "v0.2.0" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
