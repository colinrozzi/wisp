[package]
name = "theater-repl"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core theater dependencies
theater = { path = "../../../../theater/crates/theater" }

# Pack for composition (future: linking compiler with repl-actor)
pack = { path = "../../../../pack" }

# WAT to WASM conversion (for assembler host function)
wat = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization (for parsing results)
serde_json = "1.0"
